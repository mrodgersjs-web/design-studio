[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rigds-mcp"
version = "1.1.0"
description = "RIG Design Studio MCP server (stdio, newline JSON-RPC)"
requires-python = ">=3.10"
readme = "README.md"

[project.scripts]
rigds-mcp = "rigds_mcp:main"

[tool.setuptools]
py-modules = ["rigds_mcp"]
include-package-data = true

[tool.setuptools.package-dir]
"" = "mcp"
